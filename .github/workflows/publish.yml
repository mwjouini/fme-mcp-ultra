name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      pypi_token:
        description: "Optional PyPI API Token (pypi-...)"
        required: false
        type: string

jobs:
  pypi-publish:
    name: Upload Release to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling

      - name: Build Packages
        run: python -m build

      - name: Publish with Token (Secret or Dispatch Input)
        if: ${{ secrets.PYPI_API_TOKEN != '' || inputs.pypi_token != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ inputs.pypi_token != '' && inputs.pypi_token || secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Publish with OIDC Trusted Publishing
        if: ${{ secrets.PYPI_API_TOKEN == '' && inputs.pypi_token == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
