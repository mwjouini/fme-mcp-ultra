site_name: FME-MCP-ULTRA
site_description: Universal, secure, production-grade Model Context Protocol server for Safe Software FME 2025.2
site_author: Mohamed Wael JOUINI
site_url: https://mwjouini.github.io/fme-mcp-ultra/
repo_url: https://github.com/mwjouini/fme-mcp-ultra
repo_name: mwjouini/fme-mcp-ultra

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Security & Governance:
      - Security Architecture: security.md
      - Authentication: authentication.md
  - Tools Catalogue:
      - Workspaces & Jobs: tools.md
  - Compatibility & Architecture:
      - FME 2025.2 Compatibility: fme-2025-compatibility.md
      - FME 2026 Parity: fme-2026-parity.md
  - MCP Client Guides: mcp-clients.md
  - Deployment:
      - Overview: deployment.md
      - Docker: docker.md
      - Kubernetes: kubernetes.md
  - Observability: observability.md
  - Community:
      - Contributing: contributing.md
      - Code of Conduct: code-of-conduct.md
      - Roadmap: roadmap.md
