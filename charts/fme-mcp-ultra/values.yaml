replicaCount: 2

image:
  repository: ghcr.io/mwjouini/fme-mcp-ultra
  pullPolicy: IfNotPresent
  tag: "1.0.0"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: fme-mcp.internal.example.org
      paths:
        - path: /
          pathType: ImplementationSpecific

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

env:
  FME_MCP_ENVIRONMENT: "production"
  FME_MCP_LOG_LEVEL: "INFO"
  FME_MCP_TRANSPORT: "streamable_http"
  FME_MCP_HOST: "0.0.0.0"
  FME_MCP_PORT: "8000"
  FME_FLOW_URL: ""

secrets:
  apiKey: ""
  fmeFlowToken: ""

