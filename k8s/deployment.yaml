apiVersion: apps/v1
kind: Deployment
metadata:
  name: fme-mcp-ultra
  namespace: fme-mcp
  labels:
    app.kubernetes.io/name: fme-mcp-ultra
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fme-mcp-ultra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fme-mcp-ultra
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fme-mcp-ultra
          image: ghcr.io/mwjouini/fme-mcp-ultra:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http-mcp
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fme-mcp-config
            - secretRef:
                name: fme-mcp-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: data-volume
              mountPath: /data
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: data-volume
          emptyDir: {}
